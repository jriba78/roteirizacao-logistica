spring.application.name=roteirizacao-logistica

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/roteirizacao_logistica?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=root26

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Ponto de partida da roteirização (centro de distribuição). Distância em linha reta (Haversine).
app.cd.latitude=-23.55052
app.cd.longitude=-46.633308
app.cd.velocidade-media-kmh=30

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
